[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "a3docklab"
version = "0.1.0"
description = "Open-source Artemis III rendezvous-and-docking digital twin"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "A3 DockLab contributors"}]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "pandas>=2.2",
  "typer>=0.12",
]

[project.optional-dependencies]
ui = ["plotly>=6.0", "dash>=3.0"]
ml = ["scikit-learn>=1.5", "ruptures>=1.1.9", "torch>=2.4", "captum>=0.7"]
storage = ["pyarrow>=17.0"]
databricks = ["databricks-sdk>=0.64", "databricks-sql-connector[pyarrow]>=4.0"]
astro = ["astropy>=6.1"]
performance = ["numba>=0.60"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.110",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "pre-commit>=3.8",
  "types-PyYAML>=6.0",
]

[project.scripts]
a3docklab = "a3docklab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/a3docklab"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
