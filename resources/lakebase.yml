resources:
  database_instances:
    app_state:
      name: a3-docklab-${bundle.target}
      capacity: CU_1
      node_count: 1
      retention_window_in_days: 7
      enable_pg_native_login: false

  # NOTE: database_catalogs (UC registration of the Postgres DB) removed for the
  # fevm-testing-playground deploy — creating it needs CREATE CATALOG on the
  # metastore (owned by metastore_admins), which the deployer lacks. The app and
  # smoke test connect to Lakebase Postgres directly, so the UC catalog is not
  # required. The a3docklab Postgres database already exists in the instance.
