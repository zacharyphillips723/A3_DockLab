resources:
  database_instances:
    app_state:
      name: a3-docklab-${bundle.target}
      capacity: CU_1
      node_count: 1
      retention_window_in_days: 7
      enable_pg_native_login: false

  database_catalogs:
    app_state_catalog:
      name: a3docklab_state_${bundle.target}
      database_instance_name: ${resources.database_instances.app_state.name}
      database_name: a3docklab
      create_database_if_not_exists: true
