resources:
  database_instances:
    app_state:
      name: a3-docklab-${bundle.target}
      capacity: CU_1
      node_count: 1
      retention_window_in_days: 7
      enable_pg_native_login: false

  # The App connects to Lakebase directly, so UC database registration is not
  # required. The bootstrap script creates its PostgreSQL database before the
  # full bundle deploy without requiring metastore CREATE CATALOG permission.
