bundle:
  name: a3-docklab

include:
  - resources/*.yml

sync:
  include:
    - app.py
    - requirements.txt
    - pyproject.toml
    - src/**
    - configs/**
    - docs/mission_facts.yaml
    - docs/assumption_register.csv
    - databricks/**

variables:
  catalog:
    description: Unity Catalog catalog for A3 DockLab tables.
    default: main
  schema:
    description: Unity Catalog schema for A3 DockLab tables.
    default: a3docklab
  warehouse_id:
    description: SQL warehouse ID exposed to the Databricks App.
  session_artifact_volume:
    description: Managed Unity Catalog Volume for completed-session handoff artifacts.
    default: a3docklab_session_artifacts
  max_active_sessions:
    description: Maximum concurrent interactive sessions per App process.
    default: "32"
  max_owner_sessions:
    description: Maximum concurrent interactive sessions for one workspace user.
    default: "4"

scripts:
  # Break the fresh-workspace dependency cycle: first deploy only the Lakebase
  # instance, then create the database required by the App resource binding.
  bootstrap:
    env:
      A3_DB_INSTANCE: ${bundle.name}-${bundle.target}
      A3_DB_NAME: a3docklab
    content: >-
      uv run --extra databricks python databricks/grant_access.py
      --database-instance-name "$A3_DB_INSTANCE"
      --database-name "$A3_DB_NAME"
      --bootstrap-only

  # Provisions the deployed App's service principal: ensures the UC schema and
  # Lakebase database exists, then grants UC (USE CATALOG / USE SCHEMA / SELECT)
  # and Lakebase Postgres (USAGE, CREATE) access. Run after `bundle deploy` and
  # before starting the App. Idempotent.
  grant:
    env:
      A3_CATALOG: ${var.catalog}
      A3_SCHEMA: ${var.schema}
      A3_APP_NAME: ${bundle.name}-${bundle.target}
      A3_DB_INSTANCE: ${bundle.name}-${bundle.target}
      A3_DB_NAME: a3docklab
      A3_ARTIFACT_VOLUME: ${var.session_artifact_volume}
    content: >-
      uv run --extra databricks python databricks/grant_access.py
      --catalog "$A3_CATALOG"
      --schema "$A3_SCHEMA"
      --app-name "$A3_APP_NAME"
      --database-instance-name "$A3_DB_INSTANCE"
      --database-name "$A3_DB_NAME"
      --artifact-volume-name "$A3_ARTIFACT_VOLUME"

  smoke:
    env:
      A3_TARGET: ${bundle.target}
      A3_CATALOG: ${var.catalog}
      A3_SCHEMA: ${var.schema}
      A3_WAREHOUSE_ID: ${var.warehouse_id}
    content: >-
      uv run --extra databricks python databricks/smoke_test.py
      --target "$A3_TARGET"
      --catalog "$A3_CATALOG"
      --schema "$A3_SCHEMA"
      --warehouse-id "$A3_WAREHOUSE_ID"

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: a3docklab_dev

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: a3docklab
