bundle:
  name: a3-docklab

include:
  - resources/*.yml

sync:
  include:
    - app.py
    - requirements.txt
    - pyproject.toml
    - src/**
    - configs/**
    - docs/mission_facts.yaml
    - docs/assumption_register.csv
    - databricks/**

variables:
  catalog:
    description: Unity Catalog catalog for A3 DockLab tables.
    default: main
  schema:
    description: Unity Catalog schema for A3 DockLab tables.
    default: a3docklab
  warehouse_id:
    description: SQL warehouse ID exposed to the Databricks App.

scripts:
  smoke:
    env:
      A3_TARGET: ${bundle.target}
      A3_CATALOG: ${var.catalog}
      A3_SCHEMA: ${var.schema}
      A3_WAREHOUSE_ID: ${var.warehouse_id}
    content: >-
      uv run --extra databricks python databricks/smoke_test.py
      --target "$A3_TARGET"
      --catalog "$A3_CATALOG"
      --schema "$A3_SCHEMA"
      --warehouse-id "$A3_WAREHOUSE_ID"

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: a3docklab_dev

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: a3docklab
